# Name shown in the GitHub Actions page.
name: SmartRetailX CI

# Run automatically when code is pushed to main or a pull request targets main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow can read repository code but cannot modify GitHub or AWS.
permissions:
  contents: read

# If a newer commit is pushed, stop the older run to avoid wasting minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run each Python microservice test suite independently.
  backend-tests:
    name: Backend tests — ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - product-service
          - inventory-service
          - payment-service
          - order-service

    # Each test job gets its own temporary DynamoDB Local database.
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
        options: >-
          --health-cmd "echo DynamoDB Local started"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend/services/${{ matrix.service }}

    env:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: eu-west-1
      DYNAMODB_ENDPOINT: http://localhost:8000
      AUTH_TEST_MODE: "true"

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/services/${{ matrix.service }}/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Wait for DynamoDB Local
        run: |
          for attempt in {1..30}; do
            if python -c "import boto3; boto3.client('dynamodb', endpoint_url='http://localhost:8000', region_name='eu-west-1', aws_access_key_id='local', aws_secret_access_key='local').list_tables()"; then
              exit 0
            fi
            sleep 1
          done
          echo "DynamoDB Local did not become ready." >&2
          exit 1

      - name: Run pytest
        run: pytest -q

  # Build the React app. CP-051 will later add actual frontend tests here.
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies exactly from the lock file
        run: npm ci

      - name: Build React application
        run: npm run build

  # Confirm Terraform is consistently formatted and structurally valid.
  terraform-checks:
    name: Terraform checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialise Terraform without accessing or changing live state
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate

  # Confirm each deployable service image can be built.
  docker-builds:
    name: Docker build — ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - product-service
          - inventory-service
          - payment-service
          - order-service
          - outbox-relay

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Build Docker image without pushing it to AWS
        run: docker build --provenance=false -t smartretailx-ci/${{ matrix.service }} ./backend/services/${{ matrix.service }}

  # Check third-party libraries for published security vulnerabilities.
  dependency-security:
    name: Dependency security checks
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          for service in product-service inventory-service payment-service order-service outbox-relay; do
            pip-audit -r "backend/services/$service/requirements.txt"
          done

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Scan JavaScript dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high