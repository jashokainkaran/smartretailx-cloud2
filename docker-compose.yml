# Local development runs each service directly under uvicorn (hot reload,
# fast iteration) — not in a container. Only DynamoDB Local runs here, as
# the one shared dependency every service needs.
#
# Each service's Dockerfile builds a Lambda-shaped image (public.ecr.aws
# /lambda/python base, Mangum handler) instead — that image is the actual
# deployed artefact, one per service, not a local dev container.
services:
  dynamodb-local:
    image: amazon/dynamodb-local
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -inMemory -sharedDb"